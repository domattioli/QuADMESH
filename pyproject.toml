[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadmesh"
version = "0.3.0"
description = "QuADMESH+ converts an existing shallow-water triangulation into a quadrilateral mesh by merging adjacent triangle pairs layer by layer (https://github.com/domattioli/QuADMESH)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    { name = "Dominik Mattioli" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "chilmesh>=1.5.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
plot = ["matplotlib>=3.6"]
# pyquadriflow 0.0.4 (MIT, pre-alpha) ships Linux and Windows binaries only. On macOS the extra
# installs nothing; put a quadriflow executable on PATH or set QUADMESH_QUADRIFLOW (spec 058 T020).
bench-quadriflow = ["pyquadriflow; sys_platform == 'linux' or sys_platform == 'win32'"]
bench = ["quadmesh[bench-quadriflow]"]

[project.scripts]
quadmesh = "quadmesh.cli:main"
quadmesh-bench = "quadmesh.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quadmesh*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"', or skip unless --runslow)",
]
