[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadmesh"
version = "0.3.0"
description = "QuADMESH+ converts an existing shallow-water triangulation into a quadrilateral mesh by merging adjacent triangle pairs layer by layer (https://github.com/domattioli/QuADMESH)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    { name = "Dominik Mattioli" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "chilmesh>=1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
plot = ["matplotlib>=3.6"]

[project.scripts]
quadmesh = "quadmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quadmesh*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"', or skip unless --runslow)",
]
