name: Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CHILmesh from GitHub
        run: pip install git+https://github.com/domattioli/CHILmesh.git

      - name: Install QuADMESH in editable mode with dev dependencies
        run: pip install -e ".[dev]" pytest-timeout

      - name: Run pytest
        run: pytest tests/ -q --timeout=300 --timeout-method=thread
