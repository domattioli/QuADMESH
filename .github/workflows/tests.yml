# DomI-managed workflow (spec-010 v3) — materialized from template; DO NOT EDIT IN THIS REPO.
# Source: domattioli/DomI templates/workflows/tests.yml @ v1 — edit upstream, then sync.
name: Tests

on:
  # MINIMAL CI (#265, 2026-07-03): PR-to-main gate only. No push: — dev pushes
  # already hit the open rolling development→main PR's synchronize event.
  # Multi-python / cross-OS coverage belongs on release gating, not every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CHILmesh from GitHub
        run: pip install git+https://github.com/domattioli/CHILmesh.git

      - name: Install QuADMESH in editable mode with dev dependencies
        run: pip install -e ".[dev]" pytest-timeout

      - name: Run pytest
        run: pytest tests/ -q --timeout=300 --timeout-method=thread
