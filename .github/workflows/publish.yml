name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # required for actions/checkout on a private repo

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build distributions
        run: python -m build

      # Switch from OIDC trusted publishing to token auth because PyPI's
      # trusted-publisher record for this project doesn't match our OIDC claims
      # (invalid-publisher). Use stored API token instead until PyPI dashboard
      # trusted-publisher config is fixed separately.
      - name: Install twine
        run: pip install twine

      - name: Verify distributions
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
